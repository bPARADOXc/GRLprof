name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/check_release.py --no-history
      - run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q model train retrieval scripts tools tests utils eval grlprof
      - name: Shell syntax
        run: bash -c 'for file in scripts/*.sh; do bash -n "$file" || exit; done'
